# Blueprint per il deploy gratuito su Render (render.com).
# In Render: New + > Blueprint > collega questo repo GitHub > Apply.
# Dopo il primo deploy vai su Environment e compila i valori "sync: false".
services:
  - type: web
    name: cecchino-pro
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 app:app
    envVars:
      - key: CECCHINO_CRON_SECRET
        generateValue: true
      - key: CECCHINO_EMAIL_FROM
        sync: false
      - key: CECCHINO_EMAIL_PASSWORD
        sync: false
      - key: CECCHINO_PUBLIC_URL
        sync: false
