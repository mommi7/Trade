name: Cecchino Pro - tick

# Fa girare gratuitamente il controllo dei segnali chiamando /api/cron/tick
# sull'app deployata (es. su Render), anche se il servizio gratuito è
# andato in sleep per inattività (la chiamata lo risveglia).
#
# Ogni 10 minuti invece che ogni ora: su Render free il processo va in
# sleep dopo ~15 minuti senza richieste HTTP, e il bot Telegram (che gira
# in un thread di background nello stesso processo) risponde solo mentre
# il processo è sveglio. Un ping ogni 10 minuti lo mantiene sveglio quasi
# sempre, quindi il bot risulta reattivo quasi come se fosse sempre acceso
# (non è garantito al 100%: GitHub può ritardare l'esecuzione di qualche
# minuto sotto carico, e per un always-on vero senza compromessi resta
# il Raspberry Pi, vedi README).
#
# Richiede due secrets nel repo GitHub (Settings > Secrets and variables >
# Actions):
#   CECCHINO_URL          es. https://cecchino-pro.onrender.com
#   CECCHINO_CRON_SECRET  stesso valore della variabile d'ambiente
#                         CECCHINO_CRON_SECRET impostata su Render
#
# Opzionali, solo per ricevere un avviso su Telegram (invece che via mail
# da GitHub) se il tick fallisce:
#   TELEGRAM_BOT_TOKEN    stesso valore della variabile su Render
#   TELEGRAM_CHAT_ID      il tuo chat ID (app -> Impostazioni ⚙️)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama /api/cron/tick
        run: |
          curl -sS -X POST "${CECCHINO_URL}/api/cron/tick" \
            -H "X-Cron-Secret: ${CECCHINO_CRON_SECRET}" \
            --max-time 60 \
            --retry 3 \
            --retry-delay 5 \
            --fail
        env:
          CECCHINO_URL: ${{ secrets.CECCHINO_URL }}
          CECCHINO_CRON_SECRET: ${{ secrets.CECCHINO_CRON_SECRET }}

      - name: Avvisa su Telegram se il tick è fallito
        if: failure()
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID non impostati come secrets: salto l'avviso Telegram."
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ Cecchino Pro: il tick automatico su GitHub Actions è fallito. Controlla che CECCHINO_URL e CECCHINO_CRON_SECRET siano corretti nei secrets del repo, e che il sito sia raggiungibile." \
            || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
